name: Keep Streamlit awake

# Streamlit Community Cloud sleeps after ~12h with no real browser traffic.
# Plain HTTP pings do NOT wake it — need JS + WebSocket (Playwright).

on:
  schedule:
    # Every 6 hours (under the ~12h sleep window)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: keepalive-streamlit
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit live app
        env:
          STREAMLIT_APP_URL: https://heimdall-eye.streamlit.app/
        run: python scripts/keepalive_streamlit.py
