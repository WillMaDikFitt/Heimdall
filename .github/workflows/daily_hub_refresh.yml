name: Daily hub refresh

on:
  schedule:
    # 02:00 IST (20:30 UTC previous calendar day)
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      reseed_sensors:
        description: "Also reseed simulated sensors/telemetry"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-hub-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ensemble + verify for two projects regularly exceeds 45 minutes on GitHub runners.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database target
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            echo "Database target: Turso"
          else
            echo "::error::Missing GitHub Actions secrets TURSO_DATABASE_URL and/or TURSO_AUTH_TOKEN."
            echo "Add them under Settings → Secrets and variables → Actions (same values as .env)."
            exit 1
          fi

      - name: Seed simulated sensors (optional / first-time)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reseed_sensors }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/run_heimdall_simulate.py

      - name: Run hub analysis refresh
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/run_refresh_hub.py
